project:
  type: book
  output-dir: ../docs
  execute-dir: project
  render:
    - index.qmd
    - contents.qmd
    - ccpe/000-alcance-arquitectura.qmd
    - part-iv/index.qmd
    - part-iv/22-code-principles.qmd
    - references.qmd
  resources:
    - .nojekyll

lang: es

book:
  title: "Ecosistema digital para la ciencia pesquera y la ecología cuantitativa"
  subtitle: "Herramientas actuales y emergentes para datos, código, automatización, reproducibilidad, colaboración e inteligencia artificial"
  author: "Elmer Quispe-Salazar"
  date: last-modified
  description: "Libro abierto sobre herramientas e infraestructura digital reproducible para ciencia pesquera y ecología cuantitativa."
  site-url: "https://qselmer.github.io/QuantFish-LabCore/"
  repo-url: "https://github.com/qselmer/QuantFish-LabCore"
  repo-actions: [source, edit, issue]
  search: true
  reader-mode: true
  page-navigation: true
  open-graph: true
  chapters:
    - index.qmd
    - contents.qmd
    - part: "Fundamentos del ecosistema digital científico"
      chapters:
        - ccpe/000-alcance-arquitectura.qmd
    - part: part-iv/index.qmd
      chapters:
        - part-iv/22-code-principles.qmd
    - references.qmd
  page-footer:
    left: "© 2026 Elmer Quispe-Salazar"
    right: "Publicado con [Quarto](https://quarto.org/)"

bibliography: ../references/references.bib
csl: ../references/apa.csl

format:
  html:
    theme: [litera, assets/styles/book.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    code-fold: false
    link-external-newwindow: true
    smooth-scroll: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
