name: Render and publish Quarto book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        working-directory: book
        run: quarto render

      - name: Commit rendered docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Render Quarto book"
          file_pattern: docs/**
