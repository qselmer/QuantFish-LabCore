name: Validate Quarto sources

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R rendering dependencies
        run: |
          Rscript -e 'install.packages(c("knitr", "rmarkdown"), repos = "https://cloud.r-project.org")'

      - name: Set up Python rendering dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jupyter nbformat nbclient

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check Quarto installation
        run: quarto check

      - name: Render book
        run: quarto render book --to html

      - name: Render CCPE-000 class
        run: quarto render classes/ccpe-000/ccpe-000-clase.qmd --to revealjs

      - name: Render Git class
        run: quarto render classes/ccpe-023/ccpe-023-class.qmd --to revealjs

      - name: Render GitHub class
        run: quarto render classes/ccpe-024/ccpe-024-class.qmd --to revealjs
